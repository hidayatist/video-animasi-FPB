<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animasi FPB - Pembagian Makanan</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e8f4ff;
    overflow-x: hidden;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #1d4e89;
}

.video-box {
    position: relative;
    height: 560px;
    background: linear-gradient(to bottom, #8fd3ff 0%, #dff5ff 55%, #9edc7a 55%, #79c45a 100%);
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* AWAN */
.cloud {
    position: absolute;
    background: white;
    width: 120px;
    height: 45px;
    border-radius: 50px;
    opacity: 0.9;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    top: -25px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 10px;
    top: -35px;
}

.cloud1 {
    top: 70px;
    left: -150px;
    animation: moveCloud 18s linear infinite;
}

.cloud2 {
    top: 140px;
    left: -200px;
    animation: moveCloud 25s linear infinite;
}

@keyframes moveCloud {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(1200px);
    }
}

/* MEJA */
.table {
    position: absolute;
    width: 700px;
    height: 100px;
    background: #9c6337;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 20px;
}

.table::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 30px;
    background: #754222;
    bottom: -20px;
    border-radius: 10px;
}

/* KARAKTER */
.character {
    position: absolute;
    bottom: 190px;
    text-align: center;
}

.character .head {
    width: 80px;
    height: 80px;
    background: #f3c9a9;
    border-radius: 50%;
    margin: auto;
    position: relative;
}

.character .head::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 20px;
    background: #3c2a21;
    border-radius: 20px 20px 0 0;
    top: 0;
    left: 15px;
}

.character .eye {
    width: 8px;
    height: 8px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 38px;
}

.eye.left {
    left: 22px;
}

.eye.right {
    right: 22px;
}

.character .body {
    width: 95px;
    height: 100px;
    background: #3b82f6;
    margin: auto;
    border-radius: 25px 25px 10px 10px;
}

.character1 {
    left: 90px;
}

.character2 {
    right: 90px;
}

.character2 .body {
    background: #ec4899;
}

/* MAKANAN */
.food-area {
    position: absolute;
    left: 50%;
    bottom: 190px;
    transform: translateX(-50%);
    text-align: center;
}

.food {
    display: inline-block;
    margin: 10px;
    font-size: 45px;
    animation: bounce 1.5s infinite alternate;
}

@keyframes bounce {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-12px);
    }
}

/* KOTAK INFORMASI */
.info-box {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    background: rgba(255,255,255,0.92);
    padding: 18px;
    border-radius: 20px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #1f2937;
    min-height: 85px;
}

/* DIALOG */
.dialog {
    position: absolute;
    bottom: 300px;
    width: 220px;
    padding: 15px;
    background: white;
    border-radius: 20px;
    font-size: 17px;
    display: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.dialog1 {
    left: 40px;
}

.dialog2 {
    right: 40px;
}

/* HASIL FPB */
.result {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff176;
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #7c4a03;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.8s;
}

.result.show {
    transform: translateX(-50%) scale(1);
}

/* TOMBOL */
.controls {
    text-align: center;
    margin-top: 20px;
}

button {
    border: none;
    padding: 14px 25px;
    margin: 5px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

.scene-number {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
    color: #374151;
}

@media(max-width: 700px) {

    .video-box {
        height: 650px;
    }

    .character1 {
        left: 20px;
    }

    .character2 {
        right: 20px;
    }

    .table {
        width: 90%;
    }

    .dialog {
        width: 160px;
        font-size: 14px;
    }

    .info-box {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Animasi Pembelajaran FPB</h1>

<div class="video-box">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="info-box" id="infoBox">
        Selamat datang! Mari belajar FPB melalui pembagian makanan.
    </div>

    <div class="result" id="resultBox">
        🎉 FPB dari 12 dan 18 adalah 6! 🎉
    </div>

    <!-- KARAKTER 1 -->
    <div class="character character1">

        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>

        <div class="body"></div>

        <div style="font-weight:bold;">
            Ani
        </div>

    </div>

    <!-- KARAKTER 2 -->
    <div class="character character2">

        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>

        <div class="body"></div>

        <div style="font-weight:bold;">
            Budi
        </div>

    </div>

    <!-- DIALOG -->
    <div class="dialog dialog1" id="dialog1"></div>

    <div class="dialog dialog2" id="dialog2"></div>

    <!-- MAKANAN -->
    <div class="food-area">

        <div style="font-weight:bold;font-size:18px;">
            🍎 12 Apel &nbsp;&nbsp; 🥪 18 Roti
        </div>

        <div>
            <span class="food">🍎</span>
            <span class="food">🍎</span>
            <span class="food">🍎</span>
            <span class="food">🥪</span>
            <span class="food">🥪</span>
            <span class="food">🥪</span>
        </div>

    </div>

    <div class="table"></div>

</div>

<div class="controls">

    <button onclick="startAnimation()">
        ▶ Mulai Animasi
    </button>

    <button onclick="stopAudio()">
        🔇 Hentikan Audio
    </button>

    <button onclick="nextScene()">
        ⏭ Lanjutkan
    </button>

</div>

<div class="scene-number" id="sceneNumber">
    Adegan: 0
</div>

</div>

<script>

let scene = 0;

const infoBox = document.getElementById("infoBox");
const dialog1 = document.getElementById("dialog1");
const dialog2 = document.getElementById("dialog2");
const resultBox = document.getElementById("resultBox");
const sceneNumber = document.getElementById("sceneNumber");


function speak(text) {

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "id-ID";

    speech.rate = 0.9;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

}


function stopAudio() {

    window.speechSynthesis.cancel();

}


function resetScene() {

    dialog1.style.display = "none";

    dialog2.style.display = "none";

    resultBox.classList.remove("show");

}


function startAnimation() {

    scene = 0;

    resetScene();

    nextScene();

}


function nextScene() {

    resetScene();

    scene++;

    sceneNumber.innerHTML = "Adegan: " + scene;


    /* ADEGAN 1 */

    if (scene === 1) {

        infoBox.innerHTML =
        "🍎🥪 Ani dan Budi memiliki makanan untuk dibagikan secara adil.";

        speak(
        "Ani dan Budi memiliki dua belas apel dan delapan belas roti. Mereka ingin membagikan makanan tersebut secara adil."
        );

    }


    /* ADEGAN 2 */

    else if (scene === 2) {

        infoBox.innerHTML =
        "🤔 Dilema: Berapa kelompok terbanyak yang dapat menerima makanan dengan jumlah sama?";

        dialog1.style.display = "block";

        dialog1.innerHTML =
        "Kita harus membagikan semua makanan tanpa sisa!";

        dialog2.style.display = "block";

        dialog2.innerHTML =
        "Tetapi setiap kelompok harus mendapatkan jumlah yang sama!";

        speak(
        "Mereka menghadapi sebuah dilema. Semua makanan harus habis dibagikan, dan setiap kelompok harus mendapatkan jumlah yang sama."
        );

    }


    /* ADEGAN 3 */

    else if (scene === 3) {

        infoBox.innerHTML =
        "Mari cari faktor dari 12 dan 18!";

        dialog1.style.display = "block";

        dialog1.innerHTML =
        "Faktor 12: 1, 2, 3, 4, 6, 12";

        dialog2.style.display = "block";

        dialog2.innerHTML =
        "Faktor 18: 1, 2, 3, 6, 9, 18";

        speak(
        "Sekarang kita mencari faktor dari dua belas dan delapan belas. Faktor dua belas adalah satu, dua, tiga, empat, enam, dan dua belas. Faktor delapan belas adalah satu, dua, tiga, enam, sembilan, dan delapan belas."
        );

    }


    /* ADEGAN 4 */

    else if (scene === 4) {

        infoBox.innerHTML =
        "🔍 Faktor persekutuan: 1, 2, 3, dan 6";

        dialog1.style.display = "block";

        dialog1.innerHTML =
        "Faktor yang sama adalah 1, 2, 3, dan 6.";

        dialog2.style.display = "block";

        dialog2.innerHTML =
        "Yang paling besar adalah 6!";

        speak(
        "Faktor persekutuan dari dua belas dan delapan belas adalah satu, dua, tiga, dan enam. Faktor persekutuan yang paling besar adalah enam."
        );

    }


    /* ADEGAN 5 */

    else if (scene === 5) {

        infoBox.innerHTML =
        "✨ Jadi, makanan dapat dibagikan kepada 6 kelompok secara adil.";

        resultBox.classList.add("show");

        speak(
        "Jadi, faktor persekutuan terbesar dari dua belas dan delapan belas adalah enam. Artinya, Ani dan Budi dapat membuat enam kelompok pembagian makanan yang sama."
        );

    }


    /* ADEGAN 6 */

    else if (scene === 6) {

        infoBox.innerHTML =
        "📚 Kesimpulan: FPB membantu kita membagi benda ke dalam kelompok terbanyak dengan jumlah yang sama.";

        speak(
        "Kesimpulannya, Faktor Persekutuan Terbesar atau FPB dapat digunakan untuk membagi benda ke dalam kelompok sebanyak mungkin dengan jumlah yang sama dan tanpa sisa."
        );

    }


    /* SELESAI */

    else {

        scene = 0;

        sceneNumber.innerHTML =
        "Animasi selesai. Klik Mulai Animasi untuk mengulang.";

        infoBox.innerHTML =
        "🎉 Hebat! Kamu sudah belajar FPB melalui pembagian makanan.";

        speak(
        "Hebat! Kamu sudah belajar menggunakan FPB untuk menyelesaikan masalah pembagian makanan."
        );

    }

}

</script>

</body>
</html>
