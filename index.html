<script>
let scene = 0;
let voices = [];

const infoBox = document.getElementById("infoBox");
const dialog1 = document.getElementById("dialog1");
const dialog2 = document.getElementById("dialog2");
const resultBox = document.getElementById("resultBox");
const sceneNumber = document.getElementById("sceneNumber");

/* MEMUAT DAFTAR SUARA */
function loadVoices() {
    voices = window.speechSynthesis.getVoices();

    console.log("Daftar suara tersedia:");
    voices.forEach((voice) => {
        console.log(voice.name + " - " + voice.lang);
    });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();


/* MEMILIH SUARA BAHASA INDONESIA */
function getIndonesianVoice() {

    const indonesianVoice = voices.find(voice =>
        voice.lang.toLowerCase() === "id-id"
    );

    if (indonesianVoice) {
        return indonesianVoice;
    }

    const alternativeVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("id")
    );

    return alternativeVoice || null;
}


/* FUNGSI NARASI AUDIO */
function speak(text) {

    window.speechSynthesis.cancel();

    setTimeout(() => {

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "id-ID";

        const selectedVoice =
            getIndonesianVoice();

        if (selectedVoice) {
            speech.voice = selectedVoice;
        }

        /* KECEPATAN LEBIH LAMBAT AGAR JELAS */
        speech.rate = 0.82;

        /* NADA SUARA NORMAL */
        speech.pitch = 1;

        /* VOLUME MAKSIMAL */
        speech.volume = 1;

        window.speechSynthesis.speak(speech);

    }, 300);

}


/* MENGHENTIKAN AUDIO */
function stopAudio() {
    window.speechSynthesis.cancel();
}


/* RESET ADEGAN */
function resetScene() {

    dialog1.style.display = "none";
    dialog2.style.display = "none";

    resultBox.classList.remove("show");
}


/* MEMULAI ANIMASI */
function startAnimation() {

    scene = 0;

    window.speechSynthesis.cancel();

    resetScene();

    nextScene();
}


/* PINDAH KE ADEGAN BERIKUTNYA */
function nextScene() {

    window.speechSynthesis.cancel();

    resetScene();

    scene++;

    sceneNumber.innerHTML =
        "Adegan: " + scene;


    /* ADEGAN 1 */
    if (scene === 1) {

        infoBox.innerHTML =
            "🍎🥪 Ani dan Budi memiliki makanan untuk dibagikan secara adil.";

        speak(
            "Ani dan Budi memiliki dua belas apel dan delapan belas roti. " +
            "Mereka ingin membagikan makanan tersebut secara adil."
        );
    }


    /* ADEGAN 2 */
    else if (scene === 2) {

        infoBox.innerHTML =
            "🤔 Dilema: Berapa kelompok terbanyak yang dapat menerima makanan dengan jumlah sama?";

        dialog1.style.display = "block";

        dialog1.innerHTML =
            "Kita harus membagikan semua makanan tanpa sisa!";

        dialog2.style.display = "block";

        dialog2.innerHTML =
            "Tetapi setiap kelompok harus mendapatkan jumlah yang sama!";

        speak(
            "Ani dan Budi menghadapi sebuah masalah. " +
            "Semua makanan harus habis dibagikan tanpa sisa. " +
            "Selain itu, setiap kelompok harus mendapatkan jumlah makanan yang sama."
        );
    }


    /* ADEGAN 3 */
    else if (scene === 3) {

        infoBox.innerHTML =
            "🔢 Mari mencari faktor dari 12 dan 18!";

        dialog1.style.display = "block";

        dialog1.innerHTML =
            "Faktor 12:<br>1, 2, 3, 4, 6, 12";

        dialog2.style.display = "block";

        dialog2.innerHTML =
            "Faktor 18:<br>1, 2, 3, 6, 9, 18";

        speak(
            "Mari kita mencari faktor dari kedua bilangan tersebut. " +
            "Faktor dari dua belas adalah satu, dua, tiga, empat, enam, dan dua belas. " +
            "Faktor dari delapan belas adalah satu, dua, tiga, enam, sembilan, dan delapan belas."
        );
    }


    /* ADEGAN 4 */
    else if (scene === 4) {

        infoBox.innerHTML =
            "🔍 Faktor persekutuan: 1, 2, 3, dan 6";

        dialog1.style.display = "block";

        dialog1.innerHTML =
            "Faktor yang sama:<br>1, 2, 3, dan 6";

        dialog2.style.display = "block";

        dialog2.innerHTML =
            "Yang paling besar adalah 6!";

        speak(
            "Sekarang kita mencari faktor yang sama. " +
            "Faktor persekutuan dari dua belas dan delapan belas adalah satu, dua, tiga, dan enam. " +
            "Faktor persekutuan yang paling besar adalah enam."
        );
    }


    /* ADEGAN 5 */
    else if (scene === 5) {

        infoBox.innerHTML =
            "🎉 FPB dari 12 dan 18 adalah 6!";

        resultBox.classList.add("show");

        speak(
            "Jadi, Faktor Persekutuan Terbesar dari dua belas dan delapan belas adalah enam. " +
            "Dengan demikian, makanan dapat dibagikan menjadi enam kelompok dengan adil."
        );
    }


    /* ADEGAN 6 */
    else if (scene === 6) {

        infoBox.innerHTML =
            "📚 Kesimpulan: FPB digunakan untuk membagi benda ke dalam kelompok terbanyak dengan jumlah yang sama.";

        speak(
            "Kesimpulannya, Faktor Persekutuan Terbesar atau FPB dapat digunakan untuk membagi benda ke dalam kelompok sebanyak mungkin, dengan jumlah yang sama dan tanpa sisa."
        );
    }


    /* SELESAI */
    else {

        scene = 0;

        infoBox.innerHTML =
            "🎉 Hebat! Kamu sudah belajar FPB.";

        sceneNumber.innerHTML =
            "Animasi selesai";

        speak(
            "Hebat! Kamu sudah memahami bagaimana menggunakan FPB dalam masalah pembagian makanan."
        );
    }
}
</script>
